<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Upload Resize Drag Image</title>

<!-- Bootstrap -->
<!--<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">-->

<style>
  body {
    background: #f8f9fa;
  }

  .canvas {
    position: relative;
    width: 100%;
    max-width: 600px;
    height: 400px;
    border: 2px dashed #adb5bd;
    background: #fff;
    margin: auto;
    overflow: hidden;
    touch-action: none;
  }

  .img-box {
    position: absolute;
    top: 50px;
    left: 50px;
    cursor: move;
  }

  .img-box img {
    width: 200px;
    max-width: 100%;
    user-select: none;
    -webkit-user-drag: none;
  }

  .resize-handle {
    width: 14px;
    height: 14px;
    background: #0d6efd;
    position: absolute;
    right: -7px;
    bottom: -7px;
    border-radius: 50%;
    cursor: nwse-resize;
  }
</style>
</head>
<body class="p-3">

<div class="container">
  <h5 class="mb-3">Upload / Drag / Resize Image</h5>

  <input type="file" class="form-control mb-3" id="upload" accept="image/*">

  <div class="canvas" id="canvas"></div>
</div>

<script>
const upload = document.getElementById("upload");
const canvas = document.getElementById("canvas");

let box, img, handle;
let startX, startY, startW;
let dragging = false;
let resizing = false;

upload.addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    canvas.innerHTML = "";

    box = document.createElement("div");
    box.className = "img-box";

    img = document.createElement("img");
    img.src = reader.result;

    handle = document.createElement("div");
    handle.className = "resize-handle";

    box.appendChild(img);
    box.appendChild(handle);
    canvas.appendChild(box);

    enableDragResize();
  };
  reader.readAsDataURL(file);
});

function enableDragResize() {

  // drag
  box.addEventListener("pointerdown", e => {
    if (e.target === handle) return;
    dragging = true;
    startX = e.clientX - box.offsetLeft;
    startY = e.clientY - box.offsetTop;
    box.setPointerCapture(e.pointerId);
  });

  // resize
  handle.addEventListener("pointerdown", e => {
    resizing = true;
    startX = e.clientX;
    startW = img.offsetWidth;
    handle.setPointerCapture(e.pointerId);
    e.stopPropagation();
  });

  document.addEventListener("pointermove", e => {
    if (dragging) {
      box.style.left = (e.clientX - startX) + "px";
      box.style.top  = (e.clientY - startY) + "px";
    }

    if (resizing) {
      const dx = e.clientX - startX;
      img.style.width = (startW + dx) + "px";
    }
  });

  document.addEventListener("pointerup", () => {
    dragging = false;
    resizing = false;
  });
}
</script>

</body>
</html>
